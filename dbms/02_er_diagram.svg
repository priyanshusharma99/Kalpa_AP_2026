<text x="75" y="940" class="col">Notation and invariants</text>
<text x="75" y="980" class="small">? = nullable; PK = primary key; FK = foreign key.</text>
<text x="75" y="1013" class="small">UQ = unique. Dashed links have nullable user FKs.</text>
<text x="75" y="1046" class="small">Line crossings are not junctions; use L1–L10 below.</text>
<text x="75" y="1079" class="small"></text>
<text x="75" y="1112" class="small">A project always has exactly one owner membership.</text>
<text x="75" y="1145" class="small">Partial unique index permits at most one owner;</text>
<text x="75" y="1178" class="small">sync/protection triggers maintain the matching owner.</text>
<text x="75" y="1211" class="small">Owner transfer demotes the prior owner to editor.</text>
<text x="75" y="1244" class="small"></text>
<text x="75" y="1277" class="small">Content survives author deletion with a NULL author.</text>
<text x="75" y="1310" class="small">Deleting a project cascades to its content/members.</text>
<text x="75" y="1343" class="small"></text>
<text x="75" y="1376" class="small">Element positions are centres; A01 includes scale,</text>
<text x="75" y="1409" class="small">rotation and a centred scaling stroke in its bounds.</text>
<rect x="50" y="1530" width="2300" height="390" rx="12" fill="#1e293b" stroke="#475569"/>
<text x="75" y="1570" class="col">Foreign-key relationships and cardinality (per row at each end)</text>
<text x="75" y="1607" class="tag">L1</text>
<text x="145" y="1607" class="small">users → project_collaborators.user_id</text>
<text x="820" y="1607" class="small">1 user per membership; 0..N memberships per user</text>
<text x="1740" y="1607" class="small">DELETE CASCADE</text>
<text x="75" y="1636" class="tag">L2</text>
<text x="145" y="1636" class="small">role_permissions → project_collaborators.role_name</text>
<text x="820" y="1636" class="small">1 role per membership; 0..N memberships per role</text>
<text x="1740" y="1636" class="small">DELETE RESTRICT; UPDATE CASCADE</text>
<text x="75" y="1665" class="tag">L3</text>
<text x="145" y="1665" class="small">projects → project_collaborators.project_id</text>
<text x="820" y="1665" class="small">1 project per membership; 1..N memberships per project</text>
<text x="1740" y="1665" class="small">DELETE CASCADE</text>
<text x="75" y="1694" class="tag">L4</text>
<text x="145" y="1694" class="small">users → projects.owner_id</text>
<text x="820" y="1694" class="small">1 owner per project; 0..N owned projects per user</text>
<text x="1740" y="1694" class="small">DELETE CASCADE</text>
<text x="75" y="1723" class="tag">L5</text>
<text x="145" y="1723" class="small">users → canvas_elements.creator_id</text>
<text x="820" y="1723" class="small">0..1 creator per element; 0..N elements per user</text>
<text x="1740" y="1723" class="small">DELETE SET NULL</text>
<text x="75" y="1752" class="tag">L6</text>
<text x="145" y="1752" class="small">projects → canvas_elements.project_id</text>
<text x="820" y="1752" class="small">1 project per element; 0..N elements per project</text>
<text x="1740" y="1752" class="small">DELETE CASCADE</text>
<text x="75" y="1781" class="tag">L7</text>
<text x="145" y="1781" class="small">users → comment_replies.author_id</text>
<text x="820" y="1781" class="small">0..1 author per reply; 0..N replies per user</text>
<text x="1740" y="1781" class="small">DELETE SET NULL</text>
<text x="75" y="1810" class="tag">L8</text>
<text x="145" y="1810" class="small">users → comment_pins.creator_id</text>
<text x="820" y="1810" class="small">0..1 creator per pin; 0..N pins per user</text>
<text x="1740" y="1810" class="small">DELETE SET NULL</text>
<text x="75" y="1839" class="tag">L9</text>
<text x="145" y="1839" class="small">projects → comment_pins.project_id</text>
<text x="820" y="1839" class="small">1 project per pin; 0..N pins per project</text>
<text x="1740" y="1839" class="small">DELETE CASCADE</text>
<text x="75" y="1868" class="tag">L10</text>
<text x="145" y="1868" class="small">comment_pins → comment_replies.comment_id</text>
<text x="820" y="1868" class="small">1 pin per reply; 0..N replies per pin</text>
<text x="1740" y="1868" class="small">DELETE CASCADE</text>
<text x="75" y="1900" class="small">All other FK updates: NO ACTION. Nullable author/creator relations preserve content; timestamps describe current state, not audit history.</text>
</svg>